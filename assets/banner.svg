<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Yellow Palette Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="25%" stop-color="#FFF59D"/>
      <stop offset="55%" stop-color="#FDD835"/>
      <stop offset="85%" stop-color="#FBC02D"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFEE58" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FDD835" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFF9C4" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#FFEE58" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FBC02D" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Silver Star Shimmer & Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F1F5F9"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3E2723"/>
      <stop offset="100%" stop-color="#1A0C00"/>
    </linearGradient>

    <linearGradient id="subtextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4E342E"/>
      <stop offset="100%" stop-color="#37241E"/>
    </linearGradient>

    <!-- Star Glow Filters -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#CA8A04" flood-opacity="0.35"/>
    </filter>

    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#854D0E" flood-opacity="0.25"/>
    </filter>

    <!-- 4-Point Silver Star Symbol -->
    <g id="sparkleStar">
      <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="url(#silverGrad)" filter="url(#starGlow)"/>
    </g>

    <g id="miniStar">
      <circle cx="0" cy="0" r="2" fill="url(#silverGrad)" filter="url(#starGlow)"/>
    </g>
  </defs>

  <style>
    /* Slow Moving & Twinkling Keyframes for Silver Stars */
    @keyframes slowDrift1 {
      0% { transform: translate(0px, 0px) scale(0.9); opacity: 0.35; }
      50% { transform: translate(18px, -12px) scale(1.25); opacity: 0.95; }
      100% { transform: translate(0px, 0px) scale(0.9); opacity: 0.35; }
    }

    @keyframes slowDrift2 {
      0% { transform: translate(0px, 0px) scale(1.1); opacity: 0.85; }
      50% { transform: translate(-20px, 14px) scale(0.8); opacity: 0.25; }
      100% { transform: translate(0px, 0px) scale(1.1); opacity: 0.85; }
    }

    @keyframes slowDrift3 {
      0% { transform: translate(0px, 0px) scale(0.85); opacity: 0.4; }
      50% { transform: translate(14px, 16px) scale(1.3); opacity: 1; }
      100% { transform: translate(0px, 0px) scale(0.85); opacity: 0.4; }
    }

    @keyframes waveMove {
      0% { transform: translateX(0); }
      50% { transform: translateX(-30px); }
      100% { transform: translateX(0); }
    }

    .star-group-1 { animation: slowDrift1 6.5s ease-in-out infinite; }
    .star-group-2 { animation: slowDrift2 8.5s ease-in-out infinite; }
    .star-group-3 { animation: slowDrift3 5.5s ease-in-out infinite; }
    .wave-anim { animation: waveMove 10s ease-in-out infinite; }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      font-size: 64px;
      letter-spacing: -0.5px;
    }

    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 600;
      font-size: 19px;
      letter-spacing: 0.3px;
    }

    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1px;
    }
  </style>

  <!-- Base Curved Banner Container -->
  <rect width="1200" height="300" rx="20" fill="url(#bgGrad)" />

  <!-- Flowing Aesthetic Waves -->
  <g class="wave-anim">
    <path d="M 0,220 C 300,160 500,280 800,210 C 1000,160 1150,230 1200,200 L 1200,300 L 0,300 Z" fill="url(#waveGrad1)" />
    <path d="M 0,250 C 250,210 600,290 850,230 C 1050,190 1150,260 1200,240 L 1200,300 L 0,300 Z" fill="url(#waveGrad2)" />
  </g>

  <!-- ================= SILVER STARS MOVING SLOWLY BEHIND TITLE ================= -->
  
  <!-- Group 1: 4-Point Sparkles (Slow Drift 1) -->
  <g class="star-group-1">
    <use href="#sparkleStar" x="120" y="60" transform="scale(0.85)"/>
    <use href="#sparkleStar" x="260" y="110" transform="scale(0.7)"/>
    <use href="#sparkleStar" x="420" y="45" transform="scale(0.9)"/>
    <use href="#sparkleStar" x="590" y="80" transform="scale(0.65)"/>
    <use href="#sparkleStar" x="780" y="50" transform="scale(0.85)"/>
    <use href="#sparkleStar" x="930" y="95" transform="scale(0.75)"/>
    <use href="#sparkleStar" x="1080" y="55" transform="scale(0.95)"/>
    <use href="#miniStar" x="180" y="140"/>
    <use href="#miniStar" x="350" y="90"/>
    <use href="#miniStar" x="700" y="130"/>
    <use href="#miniStar" x="860" y="70"/>
    <use href="#miniStar" x="1020" y="130"/>
  </g>

  <!-- Group 2: Silver Stars (Slow Drift 2) -->
  <g class="star-group-2">
    <use href="#sparkleStar" x="190" y="85" transform="scale(0.75)"/>
    <use href="#sparkleStar" x="330" y="40" transform="scale(0.9)"/>
    <use href="#sparkleStar" x="500" y="100" transform="scale(0.7)"/>
    <use href="#sparkleStar" x="680" y="40" transform="scale(0.85)"/>
    <use href="#sparkleStar" x="840" y="115" transform="scale(0.95)"/>
    <use href="#sparkleStar" x="1000" y="45" transform="scale(0.8)"/>
    <use href="#sparkleStar" x="1140" y="100" transform="scale(0.7)"/>
    <use href="#miniStar" x="90" y="110"/>
    <use href="#miniStar" x="290" y="150"/>
    <use href="#miniStar" x="470" y="60"/>
    <use href="#miniStar" x="630" y="120"/>
    <use href="#miniStar" x="790" y="150"/>
    <use href="#miniStar" x="970" y="85"/>
    <use href="#miniStar" x="1110" y="140"/>
  </g>

  <!-- Group 3: Silver Micro-Stars & Deep Sparkles (Slow Drift 3) -->
  <g class="star-group-3">
    <use href="#sparkleStar" x="80" y="160" transform="scale(0.65)"/>
    <use href="#sparkleStar" x="220" y="30" transform="scale(0.8)"/>
    <use href="#sparkleStar" x="380" y="130" transform="scale(0.75)"/>
    <use href="#sparkleStar" x="540" y="40" transform="scale(0.95)"/>
    <use href="#sparkleStar" x="730" y="90" transform="scale(0.8)"/>
    <use href="#sparkleStar" x="890" y="35" transform="scale(0.85)"/>
    <use href="#sparkleStar" x="1050" y="110" transform="scale(0.7)"/>
    <use href="#miniStar" x="150" y="70"/>
    <use href="#miniStar" x="440" y="150"/>
    <use href="#miniStar" x="600" y="30"/>
    <use href="#miniStar" x="760" y="110"/>
    <use href="#miniStar" x="910" y="145"/>
    <use href="#miniStar" x="1160" y="50"/>
  </g>

  <!-- ================= BANNER TITLE & FOREGROUND CONTENT ================= -->

  <!-- Top Pill Badge -->
  <g filter="url(#badgeShadow)" transform="translate(600, 52)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#FFFDE7" stroke="#FDD835" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#713F12" class="tag-text">✦ SMART PRECISION AGRI-TECH ✦</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="138" text-anchor="middle" fill="url(#textGrad)" class="title-text" filter="url(#textShadow)">
    KrishiAI 360
  </text>

  <!-- Subtitle -->
  <text x="600" y="182" text-anchor="middle" fill="url(#subtextGrad)" class="subtitle-text">
    🌾 Smart IoT Sensing &nbsp;·&nbsp; 🧪 NPK AI Intelligence &nbsp;·&nbsp; 🔗 Blockchain Agri-Market
  </text>

  <!-- Bottom Accent Highlight Strip -->
  <rect x="420" y="212" width="360" height="3" rx="1.5" fill="#CA8A04" opacity="0.6"/>

</svg>
